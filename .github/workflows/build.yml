name: Build Picasso Kernel for Droidspaces

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    steps:
      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev

      - name: Clone Kernel Source
        run: |
          git clone --depth=1 https://github.com/EndCredits/kernel_xiaomi_sm7250.git -b android-4.19 kernel-source

      - name: Setup KernelSU
        run: |
          cd kernel-source
          rm -rf drivers/kernelsu KernelSU
          curl -ls https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh | bash -

      - name: Clone Toolchain (Proton Clang)
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain

      - name: Build Kernel with Full Droidspaces OSS Configs
        run: |
          cd kernel-source
          export PATH="$GITHUB_WORKSPACE/toolchain/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CC=clang
          export LLVM=1
          export LLVM_IAS=1
          
          # Áp dụng file config mặc định của picasso
          make O=out vendor/picasso_user_defconfig
          
          # Inject đầy đủ các config theo Documentation Droidspaces-OSS
          cat <<EOF >> out/.config
          # [MUST HAVE] SysV IPC & IPC Namespace
          CONFIG_SYSVIPC=y
          CONFIG_SYSVIPC_SYSCTL=y
          CONFIG_POSIX_MQUEUE=y
          CONFIG_IPC_NS=y

          # [MUST HAVE] Namespaces
          CONFIG_NAMESPACES=y
          CONFIG_NET_NS=y
          CONFIG_PID_NS=y
          CONFIG_UTS_NS=y

          # [MUST HAVE] Cgroups & System
          CONFIG_CGROUPS=y
          CONFIG_CGROUP_CPUACCT=y
          CONFIG_CGROUP_DEVICE=y
          CONFIG_CGROUP_FREEZER=y
          CONFIG_CGROUP_SCHED=y
          CONFIG_CPUSETS=y
          CONFIG_MEMCG=y
          CONFIG_SECCOMP=y
          CONFIG_SECCOMP_FILTER=y
          CONFIG_PROC_FS=y
          CONFIG_SYSFS=y

          # [RECOMMENDED] Devtmpfs, PTY & Event Loop
          CONFIG_DEVTMPFS=y
          CONFIG_DEVTMPFS_MOUNT=y
          CONFIG_EPOLL=y
          CONFIG_SIGNALFD=y
          CONFIG_BLK_DEV_LOOP=y
          CONFIG_EXT4_FS=y
          CONFIG_UNIX98_PTYS=y
          CONFIG_DEVPTS_MULTIPLE_INSTANCES=y
          CONFIG_CGROUP_NS=y

          # [OPTIONAL] Docker, UserNS, OverlayFS & Network
          CONFIG_USER_NS=y
          CONFIG_OVERLAY_FS=y
          CONFIG_FUSE_FS=y
          CONFIG_VETH=y
          CONFIG_BRIDGE=y
          CONFIG_TUN=y
          CONFIG_IPV6=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          CONFIG_NETFILTER_XT_MATCH_CONNTRACK=y
          EOF
          
          # Cập nhật lại config để kernel xử lý các dependency liên quan
          make O=out ARCH=arm64 olddefconfig
          
          # Tiến hành biên dịch kernel
          make O=out ARCH=arm64 -j$(nproc --all)

      - name: Verify Kernel Configs for Droidspaces
        run: |
          echo "===================================================="
          echo "       BẢNG KIỂM TRA CẤU HÌNH DROIDSPACES OSS       "
          echo "===================================================="
          
          CONFIG_FILE="kernel-source/out/.config"
          
          check_config() {
            if grep -q "^$1=y" "$CONFIG_FILE"; then
              echo "[✓] $1 = y"
            else
              echo "[✗] $1 MISSING / NOT ENABLED"
            fi
          }

          echo "--- [MUST HAVE] ---"
          check_config "CONFIG_SYSVIPC"
          check_config "CONFIG_IPC_NS"
          check_config "CONFIG_PID_NS"
          check_config "CONFIG_NET_NS"
          check_config "CONFIG_UTS_NS"
          check_config "CONFIG_SECCOMP"
          
          echo "--- [RECOMMENDED] ---"
          check_config "CONFIG_DEVTMPFS"
          check_config "CONFIG_CGROUP_NS"
          check_config "CONFIG_BLK_DEV_LOOP"
          
          echo "--- [OPTIONAL & DOCKER] ---"
          check_config "CONFIG_USER_NS"
          check_config "CONFIG_OVERLAY_FS"
          check_config "CONFIG_VETH"
          check_config "CONFIG_BRIDGE"
          
          echo "===================================================="

      - name: Pack Kernel with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          
          if [ -f kernel-source/out/arch/arm64/boot/Image.gz ]; then
            cp kernel-source/out/arch/arm64/boot/Image.gz AnyKernel3/
          else
            cp kernel-source/out/arch/arm64/boot/Image AnyKernel3/
          fi
          
          cat << 'EOF' > AnyKernel3/anykernel.sh
          # AnyKernel3 Setup
          properties() { '
          kernel.string=Picasso Droidspaces Kernel
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuntil=50
          os.patchlevel=auto
          device.name1=picasso
          device.name2=k305g
          supported.versions=
          supported.patchlevels=
          '; }

          block=/dev/block/bootdevice/by-name/boot;
          is_slot_device=0;
          ramdisk_compression=auto;
          patch_vbmeta_flag=0;

          . tools/ak3-core.sh;

          split_boot;
          flash_boot;
          EOF
          
          cd AnyKernel3
          zip -r9 ../Picasso-Droidspaces-Kernel.zip *

      - name: Upload Kernel & Config Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Picasso-Droidspaces-Kernel
          path: |
            Picasso-Droidspaces-Kernel.zip
            kernel-source/out/.config
